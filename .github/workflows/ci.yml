name: CI

permissions:
  contents: read

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
    - uses: actions/checkout@v7
      with:
        # The whole history, so the version can be derived from the nearest tag.
        fetch-depth: 0

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: dotnet restore
      working-directory: src

    - name: Build
      run: dotnet build --configuration Release --no-restore
      working-directory: src

    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal --collect "XPlat Code Coverage" --logger trx --results-directory "${{ github.workspace }}/test-results"
      working-directory: src

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.os }}
        path: test-results
        if-no-files-found: error

    - name: Coverage
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        directory: test-results
        fail_ci_if_error: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    - name: Pack
      if: matrix.os == 'ubuntu-latest'
      run: dotnet pack --configuration Release --no-build
      working-directory: src

    - name: Upload packages
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v7
      with:
        name: packages
        path: |
          src/**/*.nupkg
          src/**/*.snupkg
        if-no-files-found: error
