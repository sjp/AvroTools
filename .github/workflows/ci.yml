name: CI

permissions:
  contents: read

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
    - uses: actions/checkout@v7
      with:
        # The whole history, so the version can be derived from the nearest tag.
        fetch-depth: 0

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: dotnet restore
      working-directory: src

    - name: Build
      run: dotnet build --configuration Release --no-restore
      working-directory: src

    - name: Verify formatting
      # CS8618 is excluded because it is raised on fields a test fixture assigns in its setup
      # method. The build does not report it: it runs the analyser that suppresses it there,
      # which this command does not.
      if: matrix.os == 'ubuntu-latest'
      run: dotnet format --verify-no-changes --no-restore --exclude-diagnostics CS8618
      working-directory: src

    - name: Test
      # The report is left under the name the coverage engine picks. Naming it here would give
      # every test project the same one, and they share a results directory, so each run would
      # overwrite the last and only the project that finished last would be measured.
      run: dotnet test --configuration Release --no-build --no-restore --verbosity normal -- --coverage --coverage-settings "${{ github.workspace }}/src/coverage.settings.xml" --coverage-output-format cobertura
      working-directory: src

    - name: Collect the coverage reports
      # The engine names each report after a fresh guid, which matches none of the patterns
      # Codecov searches for. Copying them under names it does recognise is all this does.
      if: matrix.os == 'ubuntu-latest'
      run: |
        set -euo pipefail
        shopt -s nullglob
        mkdir -p coverage
        count=0
        for report in src/TestResults/*.cobertura.xml; do
          count=$((count + 1))
          cp "$report" "coverage/coverage.$count.cobertura.xml"
        done
        if [ "$count" -eq 0 ]; then
          echo "::error::The test run wrote no Cobertura report." >&2
          exit 1
        fi

    - name: Coverage
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        directory: coverage
        fail_ci_if_error: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    - name: Pack
      if: matrix.os == 'ubuntu-latest'
      run: dotnet pack --configuration Release --no-build
      working-directory: src

    - name: Upload packages
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v7
      with:
        name: packages
        path: |
          src/**/*.nupkg
          src/**/*.snupkg
        if-no-files-found: error
